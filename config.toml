# ============================================
# KIMI PROXY — Configuration MCP interne uniquement
# Architecture session-less : le client envoie X-Target-Base-URL + Authorization.
# Aucun provider, aucun modèle, aucune clé API dans ce fichier.
# ============================================

# ============================================
# OBSERVATION MASKING — Schéma 1
# ============================================

[observation_masking.schema1]
enabled = false
window_turns = 8
keep_errors = true
keep_last_k_per_tool = 0
placeholder_template = "[Observation masquee: resultat d'outil ancien (tool_call_id={tool_call_id}, outil={tool_name}, chars={original_chars})]"

# ============================================
# LOG WATCHER
# ============================================

[log_watcher]
enabled = false

# ============================================
# DATABASE
# ============================================

[database]
# Persistance SQLite des données MCP. false = base en mémoire.
persist_sessions = false

# ============================================
# SANITIZER (lecture seule)
# ============================================

[sanitizer]
enabled = true
threshold_tokens = 1000
preview_length = 200
# tmp_dir = "~/.kimi/tmp/kimi_proxy_masked"

# ============================================
# CONTEXT PRUNING — MCP Pruner
# ============================================

[context_pruning]
enabled = false
min_chars_to_prune = 2000
call_timeout_ms = 1500

[context_pruning.options]
max_prune_ratio = 0.55
min_keep_lines = 40
timeout_ms = 1500
annotate_lines = true
include_markers = true

# ============================================
# MCP TOOL PRUNING — Réponses MCP tools/call
# ============================================

[mcp_tool_pruning]
enabled = false

# ============================================
# MCP PRUNER — Sélection du backend (env > toml)
# ============================================

[mcp_pruner]
# Pipeline en cascade : "heuristic", "local_rag", "deepinfra".
# Exemple : "heuristic,local_rag"
backend = "heuristic,local_rag"

# Paramètres DeepInfra (sans secrets) :
# - DEEPINFRA_API_KEY (obligatoire pour activer DeepInfra)
# - DEEPINFRA_ENDPOINT_URL (optionnel)
# - DEEPINFRA_TIMEOUT_MS (optionnel)
deepinfra_timeout_ms = 20000
deepinfra_max_docs = 64

cache_ttl_s = 30
cache_max_entries = 256

# ============================================
# MCP GATEWAY — Circuit breaker
# ============================================

[mcp.gateway]
cb_enabled = true
cb_max_failures = 5
cb_similarity_threshold = 0.85

# ============================================
# MCP PHASE 3 — Serveurs externes
# ============================================

[mcp.qdrant]
url = "https://f4852e4b-fc7f-400e-a45c-11c333a7f8df.eu-west-1-0.aws.cloud.qdrant.io"
api_key = "${QDRANT_API_KEY}"
collection = "kimi_proxy_memory"
search_timeout_ms = 50

[mcp.compression]
url = "http://localhost:8001"
api_key = ""
compression_timeout_ms = 5000

[mcp.retry]
max_retries = 3
retry_delay_ms = 100
